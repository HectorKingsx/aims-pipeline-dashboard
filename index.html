<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMS V1 Pipeline Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f7f5; color: #1a1a1a;
    max-width: 1280px; margin-left: auto; margin-right: auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: #6b6b6b; font-size: 13px; margin: 0 0 16px; }
  .tabs {
    display: flex; gap: 4px; border-bottom: 1px solid #e0e0dc; margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 14px; font-size: 13px; cursor: pointer; border: none; background: none;
    color: #6b6b6b; border-bottom: 2px solid transparent; font-weight: 500;
  }
  .tab.active { color: #1a1a1a; border-bottom-color: #c15f3c; }
  .tab:hover { color: #1a1a1a; }
  .panel { display: none; }
  .panel.active { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e8e8e4; border-radius: 8px; padding: 12px 14px; }
  .card .label { font-size: 11px; color: #8a8a85; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 4px; }
  .card .value { font-size: 22px; font-weight: 600; }
  section-title { display:block; font-size: 13px; font-weight: 600; margin: 20px 0 8px; color: #444; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e8e8e4; }
  th, td { text-align: left; padding: 8px 10px; font-size: 12.5px; border-bottom: 1px solid #f0f0ec; }
  th { background: #fafaf8; color: #6b6b6b; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.completed { background: #e3f3e8; color: #2a7a42; }
  .badge.running { background: #fff3d6; color: #92680a; }
  .badge.stuck { background: #fde3e0; color: #b3311a; }
  .badge.error { background: #fde3e0; color: #b3311a; }
  .badge.proceed { background: #e3f3e8; color: #2a7a42; }
  .badge.hold { background: #fff3d6; color: #92680a; }
  .badge.reject { background: #f0f0ec; color: #6b6b6b; }
  .badge.produced { background: #fff3d6; color: #92680a; }
  .badge.ready_to_publish { background: #e3f3e8; color: #2a7a42; }
  .badge.rejected { background: #fde3e0; color: #b3311a; }
  .grid-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .content-card { background: #fff; border: 1px solid #e8e8e4; border-radius: 8px; padding: 12px; }
  .content-card .ctitle { font-size: 13px; font-weight: 600; margin: 0 0 6px; line-height: 1.3; }
  .content-card .csummary { font-size: 11.5px; color: #6b6b6b; margin: 0 0 8px; line-height: 1.4; }
  .content-card .cmeta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 10.5px; }
  .tag { background: #f0f0ec; color: #555; padding: 2px 6px; border-radius: 4px; }
  .empty-state { text-align: center; padding: 40px 20px; color: #8a8a85; font-size: 13px; }
  .refresh-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .refresh-btn { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
  .loading { color: #8a8a85; font-size: 12px; padding: 20px; text-align: center; }
  .score { font-variant-numeric: tabular-nums; }
  .error-box { background:#fde3e0;border:1px solid #f3b3a8;border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all; }
  footer { margin-top: 30px; color: #b0b0aa; font-size: 11px; text-align: center; }

  /* Siap Publish - carousel preview & aksi */
  .content-subtabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .subtab-btn {
    font-size: 12px; padding: 6px 12px; border-radius: 14px; border: 1px solid #e0e0dc;
    background: #fff; cursor: pointer; color: #6b6b6b;
  }
  .subtab-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .publish-card { background: #fff; border: 1px solid #e8e8e4; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .publish-card .pc-head { padding: 12px 14px 8px; }
  .publish-card .ptitle { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .publish-card .pmeta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: #8a8a85; align-items: center; }
  .slides-strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px; background: #fafaf8; }
  .slides-strip img { height: 160px; width: auto; border-radius: 6px; border: 1px solid #e8e8e4; flex-shrink: 0; cursor: zoom-in; }
  .publish-actions { padding: 10px 14px 14px; display: flex; gap: 8px; }
  .pbtn { flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .pbtn-approve { background: #2a7a42; color: #fff; }
  .pbtn-reject { background: #b3311a; color: #fff; }
  .pbtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pbtn.pbtn-done { background: #f0f0ec; color: #8a8a85; }
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 100; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
</style>
</head>
<body>

<div class="refresh-row">
  <div>
    <h1>AIMS V1 Pipeline Dashboard</h1>
    <p class="subtitle">Monitor discovery runs (S0–S8) dan hasil konten — data live dari Supabase</p>
  </div>
  <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
</div>

<div class="tabs">
  <button class="tab active" data-panel="overview" onclick="switchTab('overview')">Overview</button>
  <button class="tab" data-panel="runs" onclick="switchTab('runs')">Pipeline Runs</button>
  <button class="tab" data-panel="topics" onclick="switchTab('topics')">Topik &amp; Skor</button>
  <button class="tab" data-panel="content" onclick="switchTab('content')">Siap Publish</button>
  <button class="tab" data-panel="cost" onclick="switchTab('cost')">Biaya AI</button>
</div>

<div id="panel-overview" class="panel active"><div class="loading">Memuat...</div></div>
<div id="panel-runs" class="panel"><div class="loading">Memuat...</div></div>
<div id="panel-topics" class="panel"><div class="loading">Memuat...</div></div>
<div id="panel-content" class="panel"><div class="loading">Memuat...</div></div>
<div id="panel-cost" class="panel"><div class="loading">Memuat...</div></div>

<footer>AIMS V1 Pipeline Dashboard — data read-only dari Supabase (kecuali Approve/Reject di tab Siap Publish)</footer>

<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src="" alt=""></div>

<script>
const SUPABASE_URL = 'https://fwvenhqyirkgujfkwbvm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fz_uOjh55uYR7W47-11hDQ_hCgs2fI_';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.panel === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(d) {
  if (!d) return '–';
  const dt = new Date(d);
  return dt.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function runStatusBadge(run) {
  if (run.status === 'completed') return '<span class="badge completed">completed</span>';
  if (run.status === 'running') {
    const ageMin = (Date.now() - new Date(run.created_at).getTime()) / 60000;
    if (ageMin > 15) return '<span class="badge stuck">stuck (' + Math.round(ageMin) + 'm)</span>';
    return '<span class="badge running">running</span>';
  }
  return '<span class="badge error">' + escapeHtml(run.status) + '</span>';
}

function decisionBadge(d) {
  if (!d) return '<span class="tag">–</span>';
  const cls = d === 'proceed' ? 'proceed' : (d === 'hold' ? 'hold' : 'reject');
  return '<span class="badge ' + cls + '">' + escapeHtml(d) + '</span>';
}

function errorPanel(panelId, err) {
  document.getElementById(panelId).innerHTML =
    '<div class="error-box">Gagal memuat data:\n' + escapeHtml(err?.message || String(err)) + '</div>';
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}

let allRuns = [];

async function loadOverview() {
  const { data: runs, error } = await sb
    .from('discovery_runs')
    .select('id, status, current_stage, total_raw_items, total_normalized_items, total_clusters, total_canonical_topics, total_scored_topics, total_approved_topics, created_at, completed_at')
    .order('created_at', { ascending: false });

  if (error) { errorPanel('panel-overview', error); return; }
  allRuns = runs || [];

  const totalRuns = allRuns.length;
  const completed = allRuns.filter(r => r.status === 'completed').length;
  const stuckOrRunning = allRuns.filter(r => r.status === 'running');
  const stuck = stuckOrRunning.filter(r => (Date.now() - new Date(r.created_at).getTime()) / 60000 > 15).length;
  const activeRunning = stuckOrRunning.length - stuck;
  const totalApproved = allRuns.reduce((s, r) => s + (r.total_approved_topics || 0), 0);
  const totalTopics = allRuns.reduce((s, r) => s + (r.total_canonical_topics || 0), 0);
  const latest = allRuns[0];

  let html = '<div class="cards">';
  html += `<div class="card"><div class="label">Total Runs</div><div class="value">${totalRuns}</div></div>`;
  html += `<div class="card"><div class="label">Completed</div><div class="value">${completed}</div></div>`;
  html += `<div class="card"><div class="label">Sedang Jalan</div><div class="value">${activeRunning}</div></div>`;
  html += `<div class="card"><div class="label">Stuck (&gt;15m)</div><div class="value" style="color:${stuck>0?'#b3311a':'inherit'}">${stuck}</div></div>`;
  html += `<div class="card"><div class="label">Total Topik Ditemukan</div><div class="value">${totalTopics}</div></div>`;
  html += `<div class="card"><div class="label">Total Approved (proceed)</div><div class="value">${totalApproved}</div></div>`;
  html += '</div>';

  if (latest) {
    html += '<section-title>Run Terakhir</section-title>';
    html += '<table><tbody>';
    html += `<tr><th>Status</th><td>${runStatusBadge(latest)}</td></tr>`;
    html += `<tr><th>Stage Terakhir</th><td>${escapeHtml(latest.current_stage)}</td></tr>`;
    html += `<tr><th>Dimulai</th><td>${fmtDate(latest.created_at)}</td></tr>`;
    html += `<tr><th>Selesai</th><td>${fmtDate(latest.completed_at)}</td></tr>`;
    html += `<tr><th>Raw → Normalized → Clusters → Topics → Scored → Approved</th><td>${latest.total_raw_items||0} → ${latest.total_normalized_items||0} → ${latest.total_clusters||0} → ${latest.total_canonical_topics||0} → ${latest.total_scored_topics||0} → ${latest.total_approved_topics||0}</td></tr>`;
    html += '</tbody></table>';
  }

  document.getElementById('panel-overview').innerHTML = html;
}

async function loadRuns() {
  if (!allRuns.length) {
    const { data, error } = await sb
      .from('discovery_runs')
      .select('id, status, current_stage, total_raw_items, total_normalized_items, total_clusters, total_canonical_topics, total_scored_topics, total_approved_topics, created_at, completed_at')
      .order('created_at', { ascending: false });
    if (error) { errorPanel('panel-runs', error); return; }
    allRuns = data || [];
  }

  let html = '<table><thead><tr><th>Status</th><th>Stage</th><th>Raw</th><th>Norm</th><th>Cluster</th><th>Topics</th><th>Scored</th><th>Approved</th><th>Mulai</th><th>Selesai</th></tr></thead><tbody>';
  for (const r of allRuns) {
    html += `<tr>
      <td>${runStatusBadge(r)}</td>
      <td>${escapeHtml(r.current_stage)}</td>
      <td>${r.total_raw_items||0}</td>
      <td>${r.total_normalized_items||0}</td>
      <td>${r.total_clusters||0}</td>
      <td>${r.total_canonical_topics||0}</td>
      <td>${r.total_scored_topics||0}</td>
      <td>${r.total_approved_topics||0}</td>
      <td>${fmtDate(r.created_at)}</td>
      <td>${fmtDate(r.completed_at)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('panel-runs').innerHTML = html;
}

async function loadTopics() {
  const { data: rows, error } = await sb
    .from('canonical_topics')
    .select(`
      title, summary, primary_source_name, published_at, discovered_at,
      topic_scores ( total_score, passed_threshold ),
      opportunity_assessments ( opportunity_score, opportunity_type, decision ),
      format_recommendations ( primary_format, secondary_format )
    `)
    .eq('is_rejected', false)
    .order('discovered_at', { ascending: false })
    .limit(50);

  if (error) { errorPanel('panel-topics', error); return; }

  if (!rows || !rows.length) {
    document.getElementById('panel-topics').innerHTML = '<div class="empty-state">Belum ada topik. Jalankan pipeline S1 terlebih dahulu.</div>';
    return;
  }

  let html = '<table><thead><tr><th>Judul</th><th>Sumber</th><th>Skor MCDA</th><th>Opportunity</th><th>Keputusan</th><th>Format</th></tr></thead><tbody>';
  for (const t of rows) {
    const ts = Array.isArray(t.topic_scores) ? t.topic_scores[0] : t.topic_scores;
    const oa = Array.isArray(t.opportunity_assessments) ? t.opportunity_assessments[0] : t.opportunity_assessments;
    const fr = Array.isArray(t.format_recommendations) ? t.format_recommendations[0] : t.format_recommendations;
    html += `<tr>
      <td style="max-width:280px">${escapeHtml(t.title)}</td>
      <td>${escapeHtml(t.primary_source_name)}</td>
      <td class="score">${ts?.total_score ?? '–'}</td>
      <td class="score">${oa?.opportunity_score ?? '–'} ${oa?.opportunity_type ? '('+escapeHtml(oa.opportunity_type)+')' : ''}</td>
      <td>${decisionBadge(oa?.decision)}</td>
      <td>${fr?.primary_format ? escapeHtml(fr.primary_format) + (fr.secondary_format ? ' / '+escapeHtml(fr.secondary_format) : '') : '–'}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('panel-topics').innerHTML = html;
}

// ===== Tab "Siap Publish" — hasil render S3 (content_production) =====
// Diperbarui: sebelumnya membaca production_packages (tabel lama, kosong untuk
// pipeline S1→S2→S3 baru). Sekarang membaca content_production (hasil render
// nyata dari workflow "S3 - Content Generator"), join ke content_items untuk
// status keputusan publish dan ke canonical_topics untuk judul/ringkasan.
// Filter default: "produced" (menunggu review) - founder klik Approve/Reject,
// yang meng-update content_items.status ke 'ready_to_publish' / 'rejected'.
let allPublishItems = [];
let publishFilter = 'produced';

async function loadContent() {
  const { data: productions, error: prodErr } = await sb
    .from('content_production')
    .select('id, content_item_id, image_urls, template_used, rendered_at, status')
    .eq('status', 'success')
    .order('rendered_at', { ascending: false })
    .limit(100);

  if (prodErr) { errorPanel('panel-content', prodErr); return; }

  if (!productions || !productions.length) {
    document.getElementById('panel-content').innerHTML =
      '<div class="empty-state">Belum ada konten yang selesai dirender. Jalankan workflow S3 - Content Generator terlebih dahulu.</div>';
    return;
  }

  const itemIds = [...new Set(productions.map(p => p.content_item_id))];
  const { data: items, error: itemErr } = await sb
    .from('content_items')
    .select('id, canonical_topic_id, brand_id, status')
    .in('id', itemIds);
  if (itemErr) { errorPanel('panel-content', itemErr); return; }
  const itemMap = new Map((items || []).map(i => [i.id, i]));

  const topicIds = [...new Set((items || []).map(i => i.canonical_topic_id).filter(Boolean))];
  const brandIds = [...new Set((items || []).map(i => i.brand_id).filter(Boolean))];

  const [{ data: topics }, { data: brands }] = await Promise.all([
    topicIds.length
      ? sb.from('canonical_topics').select('id, title, summary, primary_source_name').in('id', topicIds)
      : Promise.resolve({ data: [] }),
    brandIds.length
      ? sb.from('brands').select('id, name').in('id', brandIds)
      : Promise.resolve({ data: [] }),
  ]);
  const topicMap = new Map((topics || []).map(t => [t.id, t]));
  const brandMap = new Map((brands || []).map(b => [b.id, b]));

  allPublishItems = productions
    .filter(p => Array.isArray(p.image_urls) && p.image_urls.length > 0)
    .map(p => {
      const item = itemMap.get(p.content_item_id);
      const topic = item ? topicMap.get(item.canonical_topic_id) : null;
      const brand = item ? brandMap.get(item.brand_id) : null;
      return {
        production_id: p.id,
        content_item_id: p.content_item_id,
        image_urls: p.image_urls,
        template_used: p.template_used,
        rendered_at: p.rendered_at,
        item_status: item ? item.status : 'unknown',
        title: topic ? topic.title : '(judul tidak tersedia)',
        summary: topic ? topic.summary : '',
        source: topic ? topic.primary_source_name : '-',
        brand_name: brand ? brand.name : '-',
      };
    });

  renderPublishPanel();
}

function setPublishFilter(f) {
  publishFilter = f;
  renderPublishPanel();
}

function renderPublishPanel() {
  const counts = {
    produced: allPublishItems.filter(it => it.item_status === 'produced').length,
    ready_to_publish: allPublishItems.filter(it => it.item_status === 'ready_to_publish').length,
    rejected: allPublishItems.filter(it => it.item_status === 'rejected').length,
    all: allPublishItems.length,
  };

  const filtered = publishFilter === 'all'
    ? allPublishItems
    : allPublishItems.filter(it => it.item_status === publishFilter);

  let html = '<div class="content-subtabs">';
  html += subtabBtn('produced', `Menunggu Review (${counts.produced})`);
  html += subtabBtn('ready_to_publish', `Disetujui (${counts.ready_to_publish})`);
  html += subtabBtn('rejected', `Ditolak (${counts.rejected})`);
  html += subtabBtn('all', `Semua (${counts.all})`);
  html += '</div>';

  if (!filtered.length) {
    html += '<div class="empty-state">Tidak ada konten di kategori ini.</div>';
    document.getElementById('panel-content').innerHTML = html;
    return;
  }

  const statusLabel = { produced: 'Menunggu Review', ready_to_publish: 'Disetujui', rejected: 'Ditolak' };

  for (const it of filtered) {
    const label = statusLabel[it.item_status] || it.item_status;
    const isApproved = it.item_status === 'ready_to_publish';
    const isRejected = it.item_status === 'rejected';
    html += `<div class="publish-card">
      <div class="pc-head">
        <p class="ptitle">${escapeHtml(it.title)}</p>
        <div class="pmeta">
          <span class="badge ${escapeHtml(it.item_status)}">${escapeHtml(label)}</span>
          <span class="tag">${escapeHtml(it.brand_name)}</span>
          <span class="tag">${it.image_urls.length} slide</span>
          <span class="tag">${escapeHtml(it.source || '-')}</span>
          <span>${fmtDate(it.rendered_at)}</span>
        </div>
      </div>
      <div class="slides-strip">
        ${it.image_urls.map(url => `<img src="${url}" loading="lazy" onclick="openLightbox('${url}')">`).join('')}
      </div>
      <div class="publish-actions">
        <button class="pbtn ${isApproved ? 'pbtn-done' : 'pbtn-approve'}"
                onclick="decidePublish('${it.content_item_id}','ready_to_publish',this)"
                ${isApproved ? 'disabled' : ''}>${isApproved ? '✓ Disetujui' : 'Approve'}</button>
        <button class="pbtn ${isRejected ? 'pbtn-done' : 'pbtn-reject'}"
                onclick="decidePublish('${it.content_item_id}','rejected',this)"
                ${isRejected ? 'disabled' : ''}>${isRejected ? '✓ Ditolak' : 'Reject'}</button>
      </div>
    </div>`;
  }

  document.getElementById('panel-content').innerHTML = html;
}

function subtabBtn(key, label) {
  return `<button class="subtab-btn ${publishFilter === key ? 'active' : ''}" onclick="setPublishFilter('${key}')">${escapeHtml(label)}</button>`;
}

async function decidePublish(contentItemId, newStatus, btnEl) {
  const card = btnEl.closest('.publish-card');
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  const { error } = await sb.from('content_items').update({ status: newStatus }).eq('id', contentItemId);
  if (error) {
    alert('Gagal menyimpan keputusan: ' + error.message);
    card.querySelectorAll('button').forEach(b => b.disabled = false);
    return;
  }
  const it = allPublishItems.find(x => x.content_item_id === contentItemId);
  if (it) it.item_status = newStatus;
  renderPublishPanel();
}

async function loadCost() {
  const { data: byStage, error } = await sb
    .from('cost_events')
    .select('stage, provider, model_version, cost_usd, tokens_input, tokens_output');

  if (error) { errorPanel('panel-cost', error); return; }

  const grouped = {};
  let total = 0;
  for (const r of (byStage || [])) {
    const key = `${r.stage}|${r.provider}|${r.model_version}`;
    if (!grouped[key]) grouped[key] = { stage: r.stage, provider: r.provider, model_version: r.model_version, calls: 0, cost: 0, tin: 0, tout: 0 };
    grouped[key].calls++;
    grouped[key].cost += Number(r.cost_usd || 0);
    grouped[key].tin += Number(r.tokens_input || 0);
    grouped[key].tout += Number(r.tokens_output || 0);
    total += Number(r.cost_usd || 0);
  }
  const rows = Object.values(grouped).sort((a, b) => b.cost - a.cost);

  let html = '<div class="cards">';
  html += `<div class="card"><div class="label">Total Biaya AI</div><div class="value">$${total.toFixed(4)}</div></div>`;
  html += '</div>';

  if (!rows.length) {
    html += '<div class="empty-state">Belum ada data biaya.</div>';
  } else {
    html += '<table><thead><tr><th>Stage</th><th>Provider</th><th>Model</th><th>Calls</th><th>Tokens In</th><th>Tokens Out</th><th>Biaya (USD)</th></tr></thead><tbody>';
    for (const r of rows) {
      html += `<tr>
        <td>${escapeHtml(r.stage)}</td>
        <td>${escapeHtml(r.provider)}</td>
        <td>${escapeHtml(r.model_version)}</td>
        <td>${r.calls}</td>
        <td>${r.tin}</td>
        <td>${r.tout}</td>
        <td>$${r.cost.toFixed(4)}</td>
      </tr>`;
    }
    html += '</tbody></table>';
  }
  document.getElementById('panel-cost').innerHTML = html;
}

async function loadAll() {
  document.querySelectorAll('.panel').forEach(p => p.innerHTML = '<div class="loading">Memuat...</div>');
  await loadOverview();
  await Promise.all([loadRuns(), loadTopics(), loadContent(), loadCost()]);
}

loadAll();
</script>
</body>
</html>
